# DevSecOps pipeline - Giai đoạn 1: secret scanning + SAST + SCA (Trivy) + SBOM
# Đặt file này tại: .github/workflows/devsecops-stage1.yml (trên nhánh mặc định của fork)
#
# Chuẩn bị trước khi chạy:
#   1. Fork Shopizer, tạo nhánh từ tag 3.2.5 và đặt làm nhánh mặc định của fork.
#   2. Điền TRIVY_VERSION trong khối env bên dưới (xem bản mới nhất ở trang Releases
#      của aquasecurity/trivy, ghi số phiên bản không kèm chữ "v", ví dụ 0.xx.x).
#   3. Lần chạy đầu để ENFORCE_GATE = "false" (chế độ baseline: chỉ báo cáo, không làm fail).
#      Đến tuần bật quality gate thì đổi thành "true".
#
# Ghi chú: SCA dùng Trivy thay cho OWASP Dependency-Check vì không cần NVD API key.

name: DevSecOps - Giai đoạn 1

on:
  pull_request:
  push:
    branches: [main, master, baseline-3.2.5]
  schedule:
    - cron: "0 2 * * 1" # Thứ Hai hằng tuần (UTC), để bắt CVE mới công bố
  workflow_dispatch:

# Quyền tối thiểu cho toàn workflow; từng job xin thêm khi cần.
permissions:
  contents: read

concurrency:
  group: devsecops-stage1-${{ github.ref }}
  cancel-in-progress: true

env:
  ENFORCE_GATE: "false" # "true" = fail pipeline khi vượt ngưỡng
  GITLEAKS_VERSION: "8.30.0"
  SEMGREP_VERSION: "1.170.0"
  TRIVY_VERSION: "0.76.1"
  TRIVY_IGNORE_UNFIXED: "false" # "true" = bỏ qua lỗ hổng chưa có bản vá

jobs:
  # ---------------------------------------------------------------------------
  secrets-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout (lấy đủ lịch sử git)
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cài gitleaks (có kiểm tra checksum)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "${base}/${file}" -o "${file}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " ${file}\$" checksums.txt | sha256sum -c -
          tar -xzf "${file}" gitleaks
          ./gitleaks version

      - name: Quét secret trong toàn bộ lịch sử commit
        run: |
          ./gitleaks git --redact \
            --report-format sarif --report-path gitleaks.sarif \
            --exit-code 0

      - name: Tổng hợp kết quả
        id: result
        run: |
          count=$(jq '[.runs[]?.results[]?] | length' gitleaks.sarif)
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          {
            echo "### Gitleaks"
            echo ""
            echo "Số secret nghi ngờ: **${count}**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Đẩy SARIF lên GitHub Code Scanning
        if: ${{ always() && hashFiles('gitleaks.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4.37.3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Lưu báo cáo
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 30

      - name: Quality gate - secret
        if: ${{ env.ENFORCE_GATE == 'true' && steps.result.outputs.count != '0' }}
        run: |
          echo "::error::Phát hiện ${{ steps.result.outputs.count }} secret nghi ngờ. Xem tab Security hoặc artifact gitleaks-report."
          exit 1

  # ---------------------------------------------------------------------------
  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Cài Semgrep
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/semgrep-venv"
          "${RUNNER_TEMP}/semgrep-venv/bin/pip" install --quiet "semgrep==${SEMGREP_VERSION}"
          "${RUNNER_TEMP}/semgrep-venv/bin/semgrep" --version

      - name: Quét SAST
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          "${RUNNER_TEMP}/semgrep-venv/bin/semgrep" scan \
            --config p/java \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --exclude "**/src/test/**" \
            --metrics=off \
            --sarif --output semgrep.sarif

      - name: Tổng hợp kết quả
        id: result
        run: |
          total=$(jq '[.runs[]?.results[]?] | length' semgrep.sarif)
          errors=$(jq '[.runs[]?.results[]? | select(.level=="error")] | length' semgrep.sarif)
          echo "total=${total}" >> "$GITHUB_OUTPUT"
          echo "errors=${errors}" >> "$GITHUB_OUTPUT"
          {
            echo "### Semgrep"
            echo ""
            echo "Tổng số phát hiện: **${total}** (mức ERROR: **${errors}**)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Đẩy SARIF lên GitHub Code Scanning
        if: ${{ always() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4.37.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Lưu báo cáo
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: ignore
          retention-days: 30

      - name: Quality gate - SAST
        if: ${{ env.ENFORCE_GATE == 'true' && steps.result.outputs.errors != '0' }}
        run: |
          echo "::error::Semgrep phát hiện ${{ steps.result.outputs.errors }} lỗi mức ERROR."
          exit 1

  # ---------------------------------------------------------------------------
  sca-trivy:
    name: SCA + SBOM (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Chọn JDK 11
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME_11_X64:-}" || { echo "::error::Runner không có JDK 11 cài sẵn"; exit 1; }
          echo "JAVA_HOME=${JAVA_HOME_11_X64}" >> "$GITHUB_ENV"
          echo "${JAVA_HOME_11_X64}/bin" >> "$GITHUB_PATH"

      - name: Build (để Maven resolve đủ dependency và module nội bộ)
        run: |
          set -euo pipefail
          chmod +x ./mvnw
          java -version
          ./mvnw -B -DskipTests \
            -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn \
            package

      - name: Cài Trivy (có kiểm tra checksum)
        run: |
          set -euo pipefail
          case "${TRIVY_VERSION}" in
            *"<"*|"") echo "::error::Chưa điền TRIVY_VERSION trong khối env"; exit 1 ;;
          esac
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          file="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL "${base}/${file}" -o "${file}"
          curl -sSfL "${base}/trivy_${TRIVY_VERSION}_checksums.txt" -o trivy-checksums.txt
          grep " ${file}\$" trivy-checksums.txt | sha256sum -c -
          tar -xzf "${file}" trivy
          ./trivy --version

      - name: Tính khóa cache theo tuần
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache CSDL lỗ hổng của Trivy
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.week.outputs.week }}
          restore-keys: |
            trivy-db-

      - name: Quét SCA
        run: |
          set -euo pipefail
          args=()
          if [ "${TRIVY_IGNORE_UNFIXED}" = "true" ]; then args+=(--ignore-unfixed); fi
          ./trivy fs . --scanners vuln \
            --format json --output trivy-report.json "${args[@]}"
          ./trivy convert --format sarif --output trivy.sarif trivy-report.json

      - name: Tạo SBOM (CycloneDX)
        run: ./trivy fs . --format cyclonedx --output sbom.cdx.json

      - name: Tổng hợp kết quả
        id: result
        run: |
          set -euo pipefail
          crit_high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH")] | length' trivy-report.json)
          echo "crit_high=${crit_high}" >> "$GITHUB_OUTPUT"
          {
            echo "### Trivy SCA"
            echo ""
            echo "| Mức độ | Số lỗ hổng |"
            echo "|---|---|"
            jq -r '[.Results[]?.Vulnerabilities[]? | (.Severity // "UNKNOWN")]
                   | group_by(.) | map("| \(.[0]) | \(length) |") | .[]' trivy-report.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Đẩy SARIF lên GitHub Code Scanning
        if: ${{ always() && hashFiles('trivy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4.37.3
        with:
          sarif_file: trivy.sarif
          category: trivy-sca

      - name: Lưu báo cáo
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: trivy-report
          path: |
            trivy-report.json
            trivy.sarif
            sbom.cdx.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Quality gate - SCA
        if: ${{ env.ENFORCE_GATE == 'true' && steps.result.outputs.crit_high != '0' }}
        run: |
          echo "::error::Trivy phát hiện ${{ steps.result.outputs.crit_high }} lỗ hổng Critical/High."
          exit 1